name: huawei_map_ohos
description: Dart platform-view adapter for the Huawei Map Kit Flutter OHOS implementation.
version: 6.11.2+304
publish_to: none
repository: https://github.com/Nyaaaaaaaaaaaaaaaaaaaaaaaa/hms-flutter-plugin/tree/feat/ios-ohos-map-kit/flutter-hms-map-ohos

environment:
  sdk: ">=2.19.0 <4.0.0"
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter
  huawei_map:
    git:
      url: https://github.com/Nyaaaaaaaaaaaaaaaaaaaaaaaa/hms-flutter-plugin.git
      ref: feat/ios-ohos-map-kit
      path: flutter-hms-map

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
